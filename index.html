<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://portfolio-soumya-ranjan.vercel.app/" />
    <link rel="canonical" href="https://portfolio-soumya-ranjan.vercel.app/" />
    <title>Redirecting to Soumya Ranjan Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(141, 98, 255, 0.28), transparent 30%),
          radial-gradient(circle at 80% 70%, rgba(216, 255, 88, 0.14), transparent 26%),
          #121116;
        color: #f7f2e9;
      }

      main {
        width: min(560px, calc(100% - 40px));
        padding: 34px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.34);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 7vw, 4rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0 auto 14px;
        color: rgba(247, 242, 233, 0.74);
        line-height: 1.6;
      }

      a {
        color: #d8ff58;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Redirecting…</h1>
      <p>Soumya Ranjan’s portfolio has moved to its Vercel deployment.</p>
      <p>If you are not redirected automatically, <a href="https://portfolio-soumya-ranjan.vercel.app/">open the portfolio here</a>.</p>
    </main>
  </body>
</html>
